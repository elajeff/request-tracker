# Loaded before default.conf (alphabetical) so every server block can use it.

# Keep a client-supplied X-Request-ID, so traffic tools can match their own records;
# otherwise use the ID nginx generates.
map $http_x_request_id $correlation_id {
    "~^[A-Za-z0-9-]{1,64}$" $http_x_request_id;
    default $request_id;
}

# $uri excludes the query string, so search text stays out of the log.
log_format timing escape=json '{"time":"$time_iso8601","requestId":"$correlation_id",'
    '"method":"$request_method","path":"$uri","status":$status,"requestSeconds":$request_time,'
    '"upstream":"$upstream_addr","upstreamConnectSeconds":"$upstream_connect_time",'
    '"upstreamHeaderSeconds":"$upstream_header_time","upstreamResponseSeconds":"$upstream_response_time"}';
