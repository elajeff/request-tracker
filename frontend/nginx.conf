server {
    listen 8080;
    server_name _;
    access_log /dev/stdout timing;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in every file name under /assets, so browsers can keep them.
    location /assets/ {
        expires max;
    }

    # index.html names the current assets, so it must always be checked again.
    location = /index.html {
        expires -1;
    }

    location /api/ {
        proxy_pass http://request-tracker:8080;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health and metrics stay on the backend port, not the public route.
    location /actuator {
        return 404;
    }
}
