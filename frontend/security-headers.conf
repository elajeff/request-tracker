# Loaded at the http level like access-log.conf, so every server block gets these headers,
# including the delivery and preview configurations that replace default.conf.
# A location that sets its own add_header stops inheriting them, so caching uses `expires` instead.

# Spring already sends nosniff on API responses; add it only where the upstream did not.
map $upstream_http_x_content_type_options $content_type_options {
    "" nosniff;
    default "";
}

add_header X-Content-Type-Options $content_type_options always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
