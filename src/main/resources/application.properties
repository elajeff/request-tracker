spring.application.name=request-tracker

# Local development defaults. Override with environment variables outside local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/request_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:request_tracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:request_tracker}

# Flyway owns schema creation and versioning.
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
