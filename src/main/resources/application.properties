spring.application.name=request-tracker

# Local development defaults. Override with environment variables outside local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/request_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:request_tracker}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:request_tracker}

# Flyway owns schema creation and versioning.
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
