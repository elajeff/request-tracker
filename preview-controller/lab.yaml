apiVersion: v1
kind: Namespace
metadata:
  name: preview-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-controller
  namespace: preview-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-controller
  namespace: preview-lab
rules:
  - apiGroups: [previews.request-tracker.dev]
    resources: [previewenvironments]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [previews.request-tracker.dev]
    resources: [previewenvironments/status]
    verbs: [patch]
  - apiGroups: [previews.request-tracker.dev]
    resources: [previewenvironments/finalizers]
    verbs: [update]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, delete]
  - apiGroups: ['']
    resources: [configmaps, services, persistentvolumeclaims]
    verbs: [get, create, patch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-controller
  namespace: preview-lab
subjects:
  - kind: ServiceAccount
    name: preview-controller
    namespace: preview-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-controller
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview-lab
  namespace: preview-lab
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 1Gi
    limits.cpu: '4'
    limits.memory: 3Gi
    requests.storage: 1Gi
    persistentvolumeclaims: '4'
    pods: '8'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-controller
  namespace: preview-lab
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: preview-controller}
  template:
    metadata:
      labels: {app: preview-controller}
    spec:
      serviceAccountName: preview-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: request-tracker-preview-controller:lab-v7
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /healthz, port: 8081}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: 8081}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
