services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: request_tracker
      POSTGRES_USER: request_tracker
      POSTGRES_PASSWORD: request_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U request_tracker -d request_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
