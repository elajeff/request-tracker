services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: request_tracker
      POSTGRES_USER: request_tracker
      POSTGRES_PASSWORD: request_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U request_tracker -d request_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SESSION_COOKIE_SECURE: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/request_tracker
      SPRING_DATASOURCE_USERNAME: request_tracker
      SPRING_DATASOURCE_PASSWORD: request_tracker
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: