name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-verify:
    name: Backend verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: request_tracker
          POSTGRES_USER: request_tracker
          POSTGRES_PASSWORD: request_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U request_tracker -d request_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend verification
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/request_tracker
          SPRING_DATASOURCE_USERNAME: request_tracker
          SPRING_DATASOURCE_PASSWORD: request_tracker
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  container-build:
    name: Container image build
    runs-on: ubuntu-latest
    needs: [backend-verify, frontend-build]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag request-tracker:ci .

      - name: Build frontend image
        run: docker build --tag request-tracker-frontend:ci --file frontend/Dockerfile frontend

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Lint Helm chart
        run: helm lint ./helm/request-tracker

      - name: Render Helm chart
        run: helm template request-tracker ./helm/request-tracker --namespace request-tracker