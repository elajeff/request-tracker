backend:
  sessionCookieSecure: true
  image:
    repository: request-tracker
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image:
    repository: request-tracker-frontend
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

postgresql:
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  database: request_tracker
  existingSecret: request-tracker-db
  persistence:
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

delivery:
  enabled: false
  replicas: 4
  traffic:
    enabled: false
    accountSecret: ""
    requestId: "54f35b91-dbfc-4b95-9570-da8c80dd5dea"
