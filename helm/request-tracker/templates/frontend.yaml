{{- if not .Values.delivery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-tracker-frontend
  labels:
    app.kubernetes.io/name: request-tracker
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: request-tracker
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: request-tracker
        app.kubernetes.io/component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          lifecycle:
            preStop:
              exec:
                # Keep nginx accepting connections while endpoint removal propagates.
                command: [sh, -c, "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: request-tracker-frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: request-tracker
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http

{{- end }}
