# The log format and $correlation_id come from access-log.conf in the frontend image.
server {
  listen 8080;
  root /usr/share/nginx/html;
  access_log /dev/stdout timing;
  location / { try_files $uri $uri/ /index.html; }
  # index.html names the current assets, so it must always be checked again.
  location = /index.html {
    expires -1;
  }
  location /api/ {
    proxy_pass http://request-tracker-delivery:8080;
    proxy_set_header X-Request-ID $correlation_id;
  }
  location /actuator { return 404; }
}
