apiVersion: argoproj.io/v1alpha1
kind: AnalysisRun
metadata:
  generateName: request-tracker-delivery-missing-metrics-
  namespace: request-tracker
spec:
  args:
    - name: revision
      value: nonexistent
  metrics:
    - name: traffic-present
      interval: 15s
      count: 1
      failureLimit: 0
      successCondition: len(result) == 1 && result[0] >= 0.5
      provider:
        prometheus:
          address: http://request-tracker-delivery-prometheus.request-tracker.svc.cluster.local:9090
          query: sum(rate(http_server_requests_seconds_count{job="request-tracker-delivery",revision="nonexistent"}[30s])) or vector(0)
