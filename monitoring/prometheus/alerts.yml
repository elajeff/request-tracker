groups:
  - name: request-tracker
    rules:
      - alert: RequestTrackerUnavailable
        expr: up{job="request-tracker"} == 0 or absent(up{job="request-tracker"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Request Tracker metrics endpoint is unavailable
      - alert: RequestTrackerHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="request-tracker",uri!~"/actuator/.*",status=~"5.."}[5m]))
          / sum(rate(http_server_requests_seconds_count{job="request-tracker",uri!~"/actuator/.*"}[5m])) > 0.05
          and sum(rate(http_server_requests_seconds_count{job="request-tracker",uri!~"/actuator/.*"}[5m])) >= 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of application requests return 5xx responses
      - alert: RequestTrackerSlowResponses
        expr: |
          sum(rate(http_server_requests_seconds_sum{job="request-tracker",uri!~"/actuator/.*"}[5m]))
          / sum(rate(http_server_requests_seconds_count{job="request-tracker",uri!~"/actuator/.*"}[5m])) > 1
          and sum(rate(http_server_requests_seconds_count{job="request-tracker",uri!~"/actuator/.*"}[5m])) >= 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mean application response latency exceeds one second
